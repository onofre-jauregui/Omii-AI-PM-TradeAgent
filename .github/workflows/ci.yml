name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ─── Job 1: Lint + risk-surface unit tests + build (every PR and push) ────
  test:
    name: Lint + unit tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # ─── Job 1d: Can the migration set rebuild the database from zero? ────────
  # TradeAgent has no staging Supabase project, so until 2026-08-06 nothing
  # exercised a migration before it reached production. This is the substitute:
  # it replays every migration into a throwaway Postgres, twice, and asserts the
  # resulting object counts. It costs nothing and needs no Supabase project.
  #
  # It is not a nicety. When this was first run, production had 35 public tables
  # while the migration set created 30 — `profiles`, `trade_lessons`,
  # `backtest_runs` and both weather-calibration tables existed only in the live
  # database, along with `handle_new_user()`, the trigger that creates a profile
  # row on signup. The schema could not have been rebuilt from this repo at all.
  # It also surfaced 20 `cron.schedule(...) ON CONFLICT ...` clauses that are not
  # valid SQL, which is why 20260504120000 half-applied and left production
  # without `compaction_log`.
  #
  # Blocking on every push and PR: the second pass is what proves migrations are
  # re-appliable, and CI replays whole files on retry.
  rehearse-migrations:
    name: Migrations rebuild the schema from zero
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: rehearsal
          POSTGRES_DB: tradeagent_migration_rehearsal
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4
      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Rehearse
        env:
          REHEARSAL_DSN: postgresql://postgres:rehearsal@localhost:5432/tradeagent_migration_rehearsal
        run: ./scripts/rehearse-migrations.sh

  # ─── Job 1b: Guard — schedule-triggered workflows must be live on main ────
  # GitHub Actions only ever evaluates a `schedule:` trigger from the repo's
  # *default* branch (`main` here) — a scheduled workflow merged to `dev` is
  # never registered, never runs, and doesn't even show up in
  # `gh workflow list`. The 90th health check built
  # `function-drift-check.yml` believing "merged to dev" was enough; it sat
  # completely inert. Non-blocking by design: a health-check PR into `dev`
  # can't fix an existing gap that requires promoting `dev` → `main` (a Hard
  # Stop only Onofre can trigger), so this only needs to make the gap loud,
  # not fail unrelated PRs. See DECISIONS.md (2026-07-30, 91st run).
  schedule-workflow-drift:
    name: Guard — schedule-triggered workflows live on main?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check every schedule-triggered workflow exists and matches on origin/main
        run: |
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            if grep -qE '^\s*schedule:' "$f"; then
              if ! git show "origin/main:$f" > /tmp/main_version.yml 2>/dev/null; then
                echo "::error file=$f::Uses 'schedule:' but does not exist on origin/main. GitHub Actions only evaluates scheduled triggers on the default branch — this workflow will NEVER fire until it's promoted to main (or it stays dead weight if intentionally dev-only)."
              elif ! diff -q "$f" /tmp/main_version.yml > /dev/null 2>&1; then
                echo "::warning file=$f::Differs from the version on origin/main. The copy actually running on schedule is main's, not this branch's."
              fi
            fi
          done
          exit 0

  # ─── Job 1c: Is there a staging Supabase project at all? ──────────────────
  # `secrets` is not available in a job-level `if:`, so the answer has to come
  # out of a job as an output. Without this, the only two options were "deploy
  # into whatever ref is configured" or "hard-fail every dev push" — and the
  # first is what put TradeAgent inside the Sound Studio project for two months.
  # Unset ⇒ jobs 2 and 3 skip with a visible warning; set ⇒ they run and the
  # guard in job 2 decides whether the target is legitimately TradeAgent's.
  staging-target:
    name: Staging Supabase project configured?
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$PROJECT_REF" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning::No STAGING_SUPABASE_PROJECT_REF set — migrations and edge functions will NOT be deployed to any pre-production backend on this push. TradeAgent has no staging Supabase project; see DECISIONS.md (2026-08-06)."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "Staging target configured: $PROJECT_REF"
          fi

  # ─── Job 2: Apply migrations → staging DB (dev push only) ─────────────────
  migrate-staging:
    name: Apply migrations → staging DB
    runs-on: ubuntu-latest
    needs: [test, staging-target]
    if: needs.staging-target.outputs.configured == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci

      # Prove the staging ref actually belongs to TradeAgent before writing to it.
      #
      # From 2026-05-30 to 2026-08-06, STAGING_SUPABASE_PROJECT_REF pointed at
      # `yxhtmqexyozptyoooxht` — the *Omii Sound Studio* project. Every `dev` push
      # applied TradeAgent migrations and deployed all 35 edge functions into a
      # different product's database, ending with 43 TradeAgent tables sitting
      # beside Sound Studio's own `sound_studio` schema, 13 TradeAgent cron jobs
      # firing ~1,000 failed runs/day in there, a TradeAgent trigger on that
      # project's `auth.users`, and two production LLM API keys stored as its
      # function secrets. Nothing in CI noticed, because nothing in CI ever asked
      # whose database it was writing to.
      #
      # Two independent assertions, because either alone is defeatable:
      #   1. The target must look like TradeAgent — its `public` schema holds the
      #      `expected_cron_jobs` marker table, or it is empty (a fresh project).
      #   2. The target must hold no foreign product schema. This is the one that
      #      would have caught the Sound Studio case on day one.
      # Fail loud and stop. A wrong ref must never reach the migration loop.
      - name: Guard — staging ref must be a TradeAgent project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$PROJECT_REF" ]; then
            echo "::error::STAGING_SUPABASE_PROJECT_REF is unset. Refusing to guess a target."
            exit 1
          fi
          # Schemas Supabase itself creates. Anything else in the list is another product.
          KNOWN='public,auth,storage,realtime,graphql,graphql_public,extensions,vault,net,cron,pgbouncer,supabase_migrations,supabase_functions,pgsodium,pgsodium_masks,_realtime,_analytics'
          RESULT=$(curl -sf -X POST \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"SELECT (SELECT count(*) FROM information_schema.tables WHERE table_schema='public') AS public_objects, (SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name='expected_cron_jobs') AS marker, (SELECT coalesce(string_agg(nspname, ','), '') FROM pg_namespace WHERE nspname NOT LIKE 'pg\\\\_%' AND nspname <> 'information_schema' AND nspname <> ALL (string_to_array('${KNOWN}', ','))) AS foreign_schemas\"}")

          PUBLIC_OBJECTS=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['public_objects'])")
          MARKER=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['marker'])")
          FOREIGN=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['foreign_schemas'])")

          if [ -n "$FOREIGN" ]; then
            echo "::error::Project ${PROJECT_REF} contains non-TradeAgent schema(s): ${FOREIGN}. This is another product's database — refusing to deploy TradeAgent into it. See DECISIONS.md (2026-08-06, Sound Studio eviction)."
            exit 1
          fi
          if [ "$MARKER" != "1" ] && [ "$PUBLIC_OBJECTS" != "0" ]; then
            echo "::error::Project ${PROJECT_REF} has ${PUBLIC_OBJECTS} object(s) in public but no 'expected_cron_jobs' marker table. It is neither a TradeAgent project nor an empty one — refusing to deploy."
            exit 1
          fi
          echo "Guard passed: ${PROJECT_REF} is a TradeAgent project (public objects: ${PUBLIC_OBJECTS}, marker: ${MARKER})."

      # Replay the pending set into staging inside a transaction that always rolls
      # back, so a migration that cannot apply here fails before anything is
      # committed rather than half-way through the run. See the script header for
      # the two Supabase-specific failures that motivated it — neither was
      # reachable from the shim-backed rehearsal above.
      - name: Preflight — do the pending migrations replay onto staging?
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
        run: ./scripts/preflight-migrations.sh

      - name: Apply pending migrations to staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
        run: |
          # Apply any migrations not yet in the remote history table, via Management API.
          # Fails the job hard on the first bad migration instead of silently recording it as
          # applied — a prior version of this loop swallowed failures with `|| echo WARN`, which
          # let staging drift ~40 migrations behind `main` undetected (see DECISIONS.md, 2026-07-27).
          APPLIED=$(curl -sf -X POST \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"SELECT version FROM supabase_migrations.schema_migrations"}' \
            | python3 -c "import sys,json; print(' '.join(r['version'] for r in json.load(sys.stdin)))" 2>/dev/null || echo "")
          for f in $(ls supabase/migrations/*.sql | sort); do
            # Full filename stem going forward, so same-day multi-file migrations get distinct
            # keys. Also check the legacy date-only prefix so migrations already recorded under
            # the old (buggy) scheme aren't re-applied wholesale by this fix.
            VERSION=$(basename "$f" .sql)
            LEGACY_VERSION=$(echo "$VERSION" | cut -d_ -f1)
            if echo "$APPLIED" | grep -qw "$VERSION" || echo "$APPLIED" | grep -qw "$LEGACY_VERSION"; then
              echo "Already applied: $VERSION"
              continue
            fi
            echo "Applying: $VERSION"
            SQL=$(python3 -c "import json,sys; print(json.dumps(open(sys.argv[1]).read()))" "$f")
            curl -sf -X POST \
              "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"query\": $SQL}"
            echo "OK: $VERSION"
            # Only record history on confirmed success — `curl -sf` above already aborts the
            # job (bash -e) on a non-2xx response, so reaching this line means it applied clean.
            curl -sf -X POST \
              "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"query\":\"INSERT INTO supabase_migrations.schema_migrations(version,name,statements) VALUES('${VERSION}','$(basename $f)','{}') ON CONFLICT DO NOTHING\"}" > /dev/null
          done

  # ─── Job 3: Deploy edge functions → staging Supabase (dev push only) ──────
  deploy-staging-functions:
    name: Deploy edge functions → staging Supabase
    runs-on: ubuntu-latest
    needs: [staging-target, migrate-staging]
    if: needs.staging-target.outputs.configured == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Deploy all functions to staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Retry each function's deploy with backoff before failing loud, so a single
          # transient deploy hiccup doesn't require a manual rerun.
          #
          # 2026-07-29 (72nd health check, run 30431158450): bundling used to import
          # supabase-js from esm.sh at deploy time; a transient CDN 5xx there (observed
          # 2026-07-28, run 30357821307: "Import ... failed: 522") aborted the whole job
          # under `bash -e` and blocked staging/e2e for every function, not just the one
          # that hit the blip. The original 3-attempt/flat-15s budget (~45s) was exhausted
          # by manage-billing while esm.sh stayed unreachable for over 2 minutes straight
          # (07:28:55-07:30:47). Widened to 5 attempts with exponential backoff
          # (15/30/60/120s, ~3.75min budget) as a stopgap.
          #
          # 2026-07-29 (77th health check, run 30450872671): the widened budget was
          # exhausted again — futures-signal failed after all 5 attempts (~7min) while
          # esm.sh 522'd repeatedly. Root cause fixed at the source instead of widening
          # further: every function now imports supabase-js via the `npm:` specifier
          # (Deno's native npm-registry resolution) instead of esm.sh's CDN, so this CI
          # step no longer depends on esm.sh's availability at all. This retry loop stays
          # as defense-in-depth against any other transient deploy hiccup (npm registry,
          # Supabase API), not as the primary fix.
          for fn in $(ls supabase/functions/ | grep -v _shared | grep -v tests); do
            delay=15
            for attempt in 1 2 3 4 5; do
              if npx supabase functions deploy "$fn" \
                --project-ref ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}; then
                break
              fi
              if [ "$attempt" = 5 ]; then
                echo "Deploy failed for $fn after 5 attempts"
                exit 1
              fi
              echo "Deploy attempt $attempt failed for $fn, retrying in ${delay}s..."
              sleep "$delay"
              delay=$((delay * 2))
            done
          done

  # ─── Job 4: E2E smoke tests → kalshitradeagent.live (dev push only) ───────
  # NOT a staging test, despite what this job was called until 2026-08-06.
  # `kalshitradeagent.live` and `kalshitradeagent.com` both serve a bundle whose
  # VITE_SUPABASE_URL is https://uyfnezxmgwitpzsrnkst.supabase.co — the
  # PRODUCTION project. The `.live` domain is a second frontend deploy against
  # the same backend, not a separate environment, so everything below reads and
  # writes production data. Named honestly so nobody treats a green run here as
  # pre-production proof. It deliberately does not depend on the staging jobs:
  # the frontend it exercises has never come from them.
  e2e-production-smoke:
    name: E2E smoke tests → kalshitradeagent.live (production backend)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Wait for Vercel deploy of the .live frontend (poll, max 3 min)
        run: |
          for i in $(seq 1 18); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://kalshitradeagent.live)
            [ "$STATUS" = "200" ] && break
            echo "Attempt $i: HTTP $STATUS — waiting 10s..."
            sleep 10
          done
      # Scoped to smoke.spec.ts on purpose. `test:e2e:smoke` used to be a bare
      # `playwright test`, so this step ran every spec in tests/e2e/ — including
      # the two that need a login, whose credentials are only passed to their own
      # steps below. The signed-in specs therefore failed here, in a step that
      # never had the secrets, and took the whole job down before the steps that
      # do have them ever ran. Each step now runs exactly what its name says.
      - name: Run E2E smoke suite
        run: npm run test:e2e:smoke
        env:
          BASE_URL: https://kalshitradeagent.live

      # 13 tests covering security headers, credential leakage in served HTML,
      # mobile layout at 375px and accessible button labels. They have existed
      # since the production-hardening pass but no npm script targeted them and
      # no job ran them, so they had never once executed in CI.
      - name: Production hardening suite
        run: npm run test:e2e:hardening
        env:
          BASE_URL: https://kalshitradeagent.live

      # Walks the rendered pricing on both surfaces — the landing page logged out
      # and /billing under a real session — against src/lib/pricing.ts. The unit
      # test proves the table matches server enforcement; only this proves the
      # deployed page renders that table, which is how two false limit claims
      # sat on the landing page for months.
      - name: Pricing surfaces suite
        run: npm run test:e2e:pricing
        env:
          BASE_URL: https://kalshitradeagent.live
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

      # The smoke suite above only visits logged-out pages. On 2026-08-04 a
      # promotion cleared every gate in this pipeline while the live dashboard
      # sat on a permanent spinner, because nothing here had ever signed in.
      # This step does, and asserts the rendered numbers match the database.
      # Blocking on purpose — a blank or lying dashboard must not reach main.
      - name: Dashboard truth gate
        run: npm run test:e2e:dashboards
        env:
          BASE_URL: https://kalshitradeagent.live
          # Only a test user's own login. The DB comparison runs through that
          # user's RLS-scoped session inside the page, so CI never holds a
          # service-role key.
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

      # The dashboard reopens on the tab the user left on, and a fresh sign-in
      # resets to the Dashboard. Both behaviours depend on the mount-time
      # restore, the auth callback and the persistence effect agreeing, which
      # unit tests on the storage module cannot observe. Runs at desktop and
      # mobile viewports because they mount different navigation components.
      - name: Dashboard tab persistence gate
        run: npm run test:e2e:tab-persistence
        env:
          BASE_URL: https://kalshitradeagent.live
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

  # ─── Job 5: Apply migrations → production DB (main push only) ─────────────
  # NOTE: requires one-time migration history repair on prod before enabling
  migrate-production:
    name: Apply migrations → production DB
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      # The gate that would have kept 2026-08-07's promotion out of a half-applied
      # state: production took 20260316000000_capture_dashboard_era_tables, then
      # died on 20260406_auto_reflect_cron, stranding the database one migration
      # into a thirty-six-migration run with the edge-function deploy blocked
      # behind it. Rolled back, so it commits nothing.
      - name: Preflight — do the pending migrations replay onto production?
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.PROD_SUPABASE_PROJECT_REF }}
        run: ./scripts/preflight-migrations.sh

      - name: Apply pending migrations to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.PROD_SUPABASE_PROJECT_REF }}
        run: |
          # Same fail-loud / success-only-recording / collision-safe scheme as migrate-staging
          # above — see that job's comments and DECISIONS.md (2026-07-27) for why.
          APPLIED=$(curl -sf -X POST \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"SELECT version FROM supabase_migrations.schema_migrations"}' \
            | python3 -c "import sys,json; print(' '.join(r['version'] for r in json.load(sys.stdin)))" 2>/dev/null || echo "")
          # Same ambiguous-date guard as migrate-staging — see that job for the
          # incident. A date shared by more than one migration is not a usable key.
          AMBIGUOUS_DATES=$(ls supabase/migrations/*.sql | xargs -n1 basename | sed 's/\.sql$//' \
            | cut -d_ -f1 | sort | uniq -d)
          for f in $(ls supabase/migrations/*.sql | sort); do
            VERSION=$(basename "$f" .sql)
            LEGACY_VERSION=$(echo "$VERSION" | cut -d_ -f1)
            if echo "$AMBIGUOUS_DATES" | grep -qx "$LEGACY_VERSION"; then
              LEGACY_VERSION=""
            fi
            if echo "$APPLIED" | grep -qw "$VERSION" \
               || { [ -n "$LEGACY_VERSION" ] && echo "$APPLIED" | grep -qw "$LEGACY_VERSION"; }; then
              echo "Already applied: $VERSION"
              continue
            fi
            echo "Applying: $VERSION"
            SQL=$(python3 -c "import json,sys; print(json.dumps(open(sys.argv[1]).read()))" "$f")
            curl -sf -X POST \
              "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"query\": $SQL}"
            echo "OK: $VERSION"
            curl -sf -X POST \
              "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"query\":\"INSERT INTO supabase_migrations.schema_migrations(version,name,statements) VALUES('${VERSION}','$(basename $f)','{}') ON CONFLICT DO NOTHING\"}" > /dev/null
          done

  # ─── Job 6: Deploy edge functions → production Supabase (main push only) ──
  deploy-production-functions:
    name: Deploy edge functions → production Supabase
    runs-on: ubuntu-latest
    needs: migrate-production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Store prior SHA for canary rollback
        run: echo "PRIOR_FUNCTIONS_SHA=$(git rev-parse HEAD~1)" >> $GITHUB_ENV
      - name: Deploy all functions to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Same transient-esm.sh-CDN retry as the staging deploy job — see that job's comment
          # (2026-07-28, run 30357821307) for the incident this guards against.
          for fn in $(ls supabase/functions/ | grep -v _shared | grep -v tests); do
            for attempt in 1 2 3; do
              if npx supabase functions deploy "$fn" \
                --project-ref ${{ secrets.PROD_SUPABASE_PROJECT_REF }}; then
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "Deploy failed for $fn after 3 attempts"
                exit 1
              fi
              echo "Deploy attempt $attempt failed for $fn, retrying in 15s..."
              sleep 15
            done
          done
      - name: Save prior SHA as artifact for canary gate
        run: echo "$PRIOR_FUNCTIONS_SHA" > prior-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: prior-sha
          path: prior-sha.txt
          retention-days: 1

  # ─── Job 7: Automated canary gate — 30-min monitor + auto-rollback ─────────
  canary-gate:
    name: Canary health gate (30 min)
    runs-on: ubuntu-latest
    needs: deploy-production-functions
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: prior-sha
      - name: Monitor canary — auto-rollback on breach
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROD_PROJECT_REF: ${{ secrets.PROD_SUPABASE_PROJECT_REF }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          #!/bin/bash
          set -e
          PRIOR_SHA=$(cat prior-sha.txt)
          DEADLINE=$((SECONDS + 1800))
          POLL=60
          ERROR_THRESHOLD=5

          echo "Canary at 10%. Prior SHA: $PRIOR_SHA. Monitoring for 30 min..."

          rollback() {
            echo "CANARY ABORT — rolling back edge functions to $PRIOR_SHA..."
            git checkout "$PRIOR_SHA" -- supabase/functions/
            for fn in $(ls supabase/functions/ | grep -v _shared | grep -v tests); do
              npx supabase functions deploy "$fn" \
                --project-ref "$PROD_PROJECT_REF" \
                || echo "WARNING: rollback failed for $fn — manual action required"
            done
            git checkout HEAD -- supabase/functions/

            echo "Rolling back Vercel frontend..."
            npx vercel rollback --token "$VERCEL_TOKEN" --yes \
              || echo "WARNING: Vercel rollback failed — run 'vercel rollback' manually"

            echo "ROLLBACK COMPLETE. Investigate compliance_log before re-deploying."
            exit 1
          }

          while [ $SECONDS -lt $DEADLINE ]; do
            sleep $POLL

            ERRORS=$(curl -sf -X POST \
              "https://api.supabase.com/v1/projects/$PROD_PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"query\": \"SELECT COUNT(*)::int AS n FROM compliance_log WHERE created_at > NOW() - INTERVAL '5 minutes' AND event_type IN ('auto_trade_error','auto_trade_strategy_error','strategy_auto_halted','kalshi_circuit_open','risk_check_failed')\"}" \
              | jq -r '.[0].n // 0')

            if [ "${ERRORS:-0}" -gt "$ERROR_THRESHOLD" ]; then
              echo "THRESHOLD BREACHED: $ERRORS error/halt events in last 5 min (limit: $ERROR_THRESHOLD)"
              rollback
            fi

            echo "$(date -u +%H:%M:%S): OK ($ERRORS errors). ~$((DEADLINE - SECONDS))s remaining..."
          done

          echo "Canary clean for 30 minutes. Vercel auto-promotes to 100%."
