name: Edge function drift check

# Detects when a production edge function no longer matches what's on `main` —
# i.e. someone ran `supabase functions deploy` directly, bypassing the
# branch → PR → merge → deploy pipeline. Health-check runs (86th-89th, 2026-07-30)
# found this exact drift by hand four runs in a row via a manual download-and-diff
# sweep; this automates that sweep so drift is caught within hours instead of
# whenever the next manual sweep happens to be run. See DECISIONS.md (2026-07-30).

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {}

jobs:
  drift-check:
    name: Diff deployed functions against main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Download deployed functions and diff against main
        id: diff
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.PROD_SUPABASE_PROJECT_REF }}
        run: |
          set -e
          for fn in $(ls supabase/functions/ | grep -v _shared | grep -v tests); do
            npx supabase functions download "$fn" --project-ref "$PROJECT_REF" --use-api
          done

          if git diff --quiet -- supabase/functions/; then
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          else
            echo "drifted=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- supabase/functions/ | tee drift.diff
            git diff -- supabase/functions/ >> drift.diff
          fi
      - uses: actions/upload-artifact@v4
        if: steps.diff.outputs.drifted == 'true'
        with:
          name: drift-diff
          path: drift.diff
          retention-days: 14
      - name: Alert on drift
        if: steps.diff.outputs.drifted == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          FILES=$(git diff --name-only -- supabase/functions/ | tr '\n' ' ')
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="[TradeAgent] Edge function drift detected — deployed code no longer matches main: ${FILES}. Diff: ${RUN_URL}"
      - name: Fail loud on drift
        if: steps.diff.outputs.drifted == 'true'
        run: |
          echo "Deployed function(s) differ from main — see the drift-diff artifact and the Telegram alert."
          exit 1
